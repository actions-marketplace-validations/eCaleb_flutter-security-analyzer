# Publish to TestPyPI and PyPI
#
# Uses PyPI trusted publishing, so no API token or password is stored in
# the repository or in GitHub secrets. PyPI checks a short-lived token
# that GitHub issues to this workflow instead.
#
# - Run it by hand from the Actions tab to upload to TestPyPI.
# - Publishing a GitHub release (tag v<version>) uploads to PyPI.
#
# Actions are pinned to full commit SHAs so a moved or compromised tag
# cannot change what runs with publishing rights.
#
# Author: Caleb Elebhose

name: Publish

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

# Never run two uploads at once, and never cancel one halfway through
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    name: Build and check the package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Build the sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check --strict dist/*

      - name: Check the release tag matches the package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(ls dist/*.whl | sed -E 's/.*-([^-]+)-py3-none-any\.whl$/\1/')
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Release tag $TAG does not match package version $VERSION"
            exit 1
          fi

      - name: Upload the built package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/flutter-security-analyzer
    permissions:
      id-token: write # lets PyPI verify this workflow through trusted publishing

    steps:
      - name: Download the built package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/flutter-security-analyzer
    permissions:
      id-token: write # lets PyPI verify this workflow through trusted publishing

    steps:
      - name: Download the built package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
