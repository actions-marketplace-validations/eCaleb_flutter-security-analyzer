# Flutter Security Scanner - CI/CD Pipeline
#
# This workflow runs on every push and pull request to ensure:
# 1. All unit tests pass across Python 3.10, 3.11, 3.12 and 3.13
# 2. The package builds, passes twine check and installs from the wheel
# 3. The scanner runs successfully against the sample vulnerable app
# 4. Scan results are uploaded as workflow artifacts
# 5. The GitHub Action works on Linux, macOS and Windows
#
# Actions are pinned to full commit SHAs.
#
# Author: Caleb Elebhose
# Module: WB7103/WB7104 MSc Cybersecurity Project
# University of Chester

name: Flutter Security Scanner CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================
  # Job 1: Run unit tests across multiple Python versions
  # ===========================================================
  test:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Run unit tests
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Run unit tests with coverage
        if: matrix.python-version == '3.12'
        run: |
          python -m pytest tests/ -v --cov=src --cov-report=term-missing --cov-report=html:coverage-report

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage-report/
          retention-days: 14

  # ===========================================================
  # Job 2: Run the scanner against the sample vulnerable app
  # ===========================================================
  scan:
    name: Scanner Integration Test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Build the package and check it is ready for PyPI
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*

      - name: Install the built wheel and check the command works
        run: |
          pip install dist/*.whl
          flutter-security-analyzer --version
          flutter-security-analyzer samples/vulnerable_app.dart -f json -o /tmp/installed-scan.json || true
          test -s /tmp/installed-scan.json

      - name: Run scan on sample vulnerable app (Console)
        run: |
          flutter-security-analyzer samples/vulnerable_app.dart -f console -v || true

      - name: Run scan on sample vulnerable app (JSON)
        run: |
          flutter-security-analyzer samples/vulnerable_app.dart -f json -o scan-results.json -v || true

      - name: Run scan on sample vulnerable app (HTML)
        run: |
          python -m flutter_security_analyzer samples/vulnerable_app.dart -f html -o scan-report.html -v || true

      - name: Display scan summary
        run: |
          echo "=== Scan Results Summary ==="
          if [ -f scan-results.json ]; then
            python -c "
          import json
          with open('scan-results.json') as f:
              data = json.load(f)
          findings = data.get('findings', [])
          print(f'Total findings: {len(findings)}')
          severities = {}
          for f_item in findings:
              s = f_item.get('severity', 'unknown')
              severities[s] = severities.get(s, 0) + 1
          for sev, count in sorted(severities.items()):
              print(f'  {sev}: {count}')
          categories = {}
          for f_item in findings:
              c = f_item.get('masvs_category', 'unknown')
              categories[c] = categories.get(c, 0) + 1
          for cat, count in sorted(categories.items()):
              print(f'  {cat}: {count}')
          "
          fi

      - name: Upload scan results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-results
          path: |
            scan-results.json
            scan-report.html
          retention-days: 30

      - name: Check for critical findings
        run: |
          if [ -f scan-results.json ]; then
            CRITICAL=$(python -c "
          import json
          with open('scan-results.json') as f:
              data = json.load(f)
          critical = sum(1 for f in data.get('findings', []) if f.get('severity') == 'critical')
          print(critical)
          ")
            if [ "$CRITICAL" -gt 0 ]; then
              echo "::warning::Found $CRITICAL critical severity findings"
            fi
          fi

  # ===========================================================
  # Job 3: Run this repository's GitHub Action on each OS
  # ===========================================================
  action:
    name: GitHub Action (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the action on the sample apps
        id: scan
        uses: ./ # zizmor: ignore[self-repository] $/ is not supported by actionlint 1.7.12 yet
        with:
          path: samples
          upload-sarif: 'false'
          fail-on: never

      - name: Check the action's outputs and report
        shell: bash
        env:
          SARIF_FILE: ${{ steps.scan.outputs.sarif-file }}
          FINDINGS: ${{ steps.scan.outputs.findings }}
          CRITICAL: ${{ steps.scan.outputs.critical }}
        run: |
          echo "findings=$FINDINGS critical=$CRITICAL"
          test -s "$SARIF_FILE"
          test "$FINDINGS" -gt 0
          test "$CRITICAL" -gt 0
          grep -q '"version": "2.1.0"' "$SARIF_FILE"
          grep -q '"uri": "samples/vulnerable_app.dart"' "$SARIF_FILE"
          if grep -q '"uri": "samples\\\\' "$SARIF_FILE"; then
            echo "::error::SARIF paths must use forward slashes"
            exit 1
          fi

      - name: Run the action with fail-on set to critical
        id: strict
        continue-on-error: true
        uses: ./ # zizmor: ignore[self-repository] $/ is not supported by actionlint 1.7.12 yet
        with:
          path: samples
          upload-sarif: 'false'
          fail-on: critical
          sarif-file: strict.sarif

      - name: Check fail-on stopped the step
        shell: bash
        env:
          OUTCOME: ${{ steps.strict.outcome }}
        run: |
          echo "outcome=$OUTCOME"
          test "$OUTCOME" = failure
