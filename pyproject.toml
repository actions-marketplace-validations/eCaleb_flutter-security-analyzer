[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flutter-security-analyzer"
dynamic = ["version"]
description = "Static security analysis tool for Flutter/Dart applications with MASVS compliance mapping"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Caleb Elebhose", email = "elebhosec@gmail.com" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["flutter", "dart", "security", "scanner", "masvs", "owasp", "static-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[project.scripts]
flutter-security-analyzer = "flutter_security_analyzer.main:main"

[project.urls]
Homepage = "https://github.com/eCaleb/flutter-security-analyzer"
Source = "https://github.com/eCaleb/flutter-security-analyzer"
Issues = "https://github.com/eCaleb/flutter-security-analyzer/issues"

[tool.setuptools.dynamic]
version = { attr = "flutter_security_analyzer.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
